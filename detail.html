<div class="header-blur-curtain"></div>

  <div class="app-header-inner">
    <div class="app-title">
      <div class="app-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="100%" stop-color="#d8d0e8" stop-opacity="0.9"/></linearGradient></defs>

          <polygon class="hex" points="20,2 26.5,5.8 26.5,12.2 20,16 13.5,12.2 13.5,5.8"/>

          <polygon class="hex" points="29,18 35.5,21.8 35.5,28.2 29,32 22.5,28.2 22.5,21.8"/>

          <polygon class="hex" points="11,18 17.5,21.8 17.5,28.2 11,32 4.5,28.2 4.5,21.8"/>

          <circle cx="20" cy="19" r="3" fill="#7E6FA8" opacity="0.9"/>
          <circle cx="18.5" cy="17.5" r="1.3" fill="#fff" opacity="0.45"/>
          <circle class="hex-dot hex-dot-1" cx="20" cy="10" r="1.2"/>
          <circle class="hex-dot hex-dot-2" cx="28" cy="14.5" r="1.2"/>
          <circle class="hex-dot hex-dot-3" cx="28" cy="23.5" r="1.2"/>
          <circle class="hex-dot hex-dot-4" cx="12" cy="14.5" r="1.2"/>

      </div>
      <span class="app-name">MASTER<span class="app-name-accent">DATA</span></span>
    </div>
    <div class="app-actions">
      <a href="index.html" class="hBtn hGrey waves-effect"><i class="material-icons">arrow_back</i><span class="label">Back to List</span></a>
      <a href="javascript:;" class="hBtn hGrey waves-effect" id="btnClearAll"><i class="material-icons">refresh</i><span class="label">Clear All</span></a>
      <a href="javascript:;" class="hBtn hBlue waves-effect" id="btnSave"><i class="material-icons">save</i><span class="label">Save</span></a>
      <a href="javascript:;" class="hBtn hViolet waves-effect" id="btnRequest"><i class="material-icons">send</i><span class="label">Request</span></a>
    </div>
  </div>

<main class="app-main">
  <article class="detail-layout">

    <!-- Left: Routing Information -->
    <aside class="detail-left">
      <div class="routing-panel glass-panel">
        <div class="routing-header">
          <h3><i class="material-icons">account_tree</i>Workflow</h3>
          <a href="javascript:;" class="hBtn hBtn-sm hViva hBtn-pulse waves-effect" id="btnProcessMap"><i class="material-icons">map</i><span class="label">Process Map</span></a>
        </div>

        <div class="routing-timeline" id="routingTimeline"></div>
      </div>
    </aside>

    <!-- Right: Request Form -->
    <section class="detail-right" id="detailRight">

      <!-- Title bar -->
      <div class="detail-title-bar glass-panel">
        <div class="detail-title-left">
          <span class="detail-type-badge" id="titleBadge">Finished Goods</span>
          <h2><span class="detail-mr-id" id="dHeadId">[MR-1022501]</span><span class="detail-mr-desc" id="dHeadDesc">DESC-L-054/DRUM/254KG</span></h2>
        </div>
        <div class="detail-title-right">
          <span class="detail-last-mod" id="titleLastMod">Last Mod. Feb 05, 2026 02:35 PM</span>
        </div>
      </div>

      <!-- Material: stage sections / Customer: content body -->
      <div id="stageSections"></div>
      <div id="contentBody"></div>

    </section>
  </article>
</main>

<!-- Process Map Modal -->
<div id="pmModal" class="modal search-modal pm-modal">
  <div class="modal-header">
    <h5><i class="material-icons">account_tree</i><span id="pmTitle">Process Map</span></h5>
    <a href="javascript:;" class="modal-close"><i class="material-icons">close</i></a>
  </div>
  <div class="modal-content pm-body" id="pmBody"></div>
</div>

<!-- Compare (Duplicate) Modal -->
<div id="cmpModal" class="modal search-modal cmp-modal">
  <div class="modal-header">
    <h5><i class="material-icons">compare_arrows</i><span>Material Comparison</span></h5>
    <a href="javascript:;" class="modal-close"><i class="material-icons">close</i></a>
  </div>
  <div class="modal-content cmp-body" id="cmpBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

</html>
